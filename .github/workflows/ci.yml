name: CI

# The Switch's .nro on every push and pull request, and nothing else
# (switch-port.md, 6.5): the tests run by hand on a Mac or Linux (README,
# "Local builds"), and the .nsp is packed on the maintainer's machine with
# their console's keys (tools/switch/make-nsp.sh).
on:
  push:
  pull_request:

jobs:
  switch:
    name: Nintendo Switch (.nro)
    runs-on: ubuntu-24.04
    # devkitA64, libnx, devkitPro's SDL 2, and a C++ compiler and CMake for
    # the container itself: the build makes bbassets and the runtime pack
    # first (cmake/BBSwitch.cmake).
    container: devkitpro/devkita64
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake --preset switch

      - name: Build
        run: cmake --build --preset switch --parallel

      - uses: actions/upload-artifact@v6
        with:
          name: blipblop-nro
          path: build/switch/blipblop.nro
