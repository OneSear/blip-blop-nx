name: Release
# Builds the Switch's .nro with the tag's version and attaches it to the
# GitHub release of a tag (switch-port.md, 6.5):
# - a pushed tag v* (creating a release with a new tag in GitHub pushes the
#   tag too);
# - by hand (Actions > Release > Run workflow) for an existing tag.
# A release that does not exist yet is created as a draft with generated
# notes, and published once the .nro is attached; one made in GitHub is left
# as it is. The .nsp needs the maintainer's console keys, which CI never
# has: they attach it afterwards with tools/switch/make-nsp.sh --upload <tag>.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to build (for example v1.0.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.release.outputs.created }}
    steps:
      - name: Create the release if the tag has none
        id: release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "Blip & Blop $TAG" --generate-notes
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  nro:
    name: Nintendo Switch (.nro)
    needs: release
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # The .nro carries the tag's version (v1.2.0 -> 1.2.0).
      - name: Configure
        run: cmake --preset switch -DBB_PACKAGE_VERSION="${TAG#v}"

      - name: Build
        run: cmake --build --preset switch --parallel

      # The folder to copy to the SD card's root: switch/blipblop/blipblop.nro.
      - name: Zip
        run: |
          mkdir -p sd/switch/blipblop
          cp build/switch/blipblop.nro sd/switch/blipblop/
          cd sd && zip -r "../blipblop-${TAG#v}-switch-nro.zip" switch

      # The container has no GitHub CLI: Debian's.
      - name: Attach the .nro to the release
        run: |
          apt-get update -qq && apt-get install -y -qq gh > /dev/null
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber blipblop-*-switch-nro.zip

  publish:
    name: Publish
    needs: [release, nro]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the draft release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
